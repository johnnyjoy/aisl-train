# SPDX-License-Identifier: Apache-2.0
services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AISL_REF: ${AISL_REF:-main}
        AISL_TRAIN_COMMIT: ${AISL_TRAIN_COMMIT:-unknown}
    image: ${AISL_TRAIN_IMAGE:-aisl-train:local}
    working_dir: /workspace/aisl-train
    gpus: all
    shm_size: "16gb"
    ipc: host
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      HF_DATASETS_CACHE: /cache/datasets
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      AISL_ROOT: /workspace/aisl
      AISL_PACKAGED_DATA: /opt/aisl-data
    volumes:
      - ${MODEL_HOST_PATH:-./model}:/models/base:ro
      - ${OUTPUT_HOST_PATH:-./output}:/output
      - ${CACHE_HOST_PATH:-./cache}:/cache
    command: ["aisl-train", "--help"]
